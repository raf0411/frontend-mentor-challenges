  <title>Frontend Mentor | Base Apparel coming soon page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

  <main>
    <div class="left-side">
      <img src="./images/logo.svg" alt="logo" id="logo">
      
      <div class="text-content-container">
        <h1>We're <br/> <span>coming <br/> soon</span></h1>
        <p>Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with announcements and our launch deals.</p>
      </div>

      <div class="input-box">
        <input placeholder="Email Address" type="email" name="email" id="email" class="email"/>
        <button id="submit-btn" class="submit-btn"><img src="./images/icon-arrow.svg" alt="icon arrow"></button>
      </div>
    </div>

    <div class="right-side">
      <img src="./images/hero-desktop.jpg" alt="woman">
    </div>
  </main>
