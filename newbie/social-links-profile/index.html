<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="./style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>

  <main>
    <div class="card">
      <div class="upper-section">
        <img src="./assets/images/avatar-jessica.jpeg" alt="profile image" class="profile-image">
        <h1 class="name">Jessica Randall</h1>
        <h2 class="location">London, United Kingdom</h2>
      </div>

      <div class="bottom-section">
        <p class="profile-description">"Front-end developer and avid reader."</p>
        <ul>
          <li><a href="https://github.com" class="link-btn">GitHub</a></li>
          <li><a href="https://www.frontendmentor.io" class="link-btn">Frontend Mentor</a></li>
          <li><a href="https://www.linkedin.com" class="link-btn" class="link-btn">LinkedIn</a></li>
          <li><a href="https://x.com/" class="link-btn">Twitter</a></li>
          <li><a href="https://www.instagram.com/" class="link-btn">Instagram</a></li>
        </ul>
      </div>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by &ThinSpace; <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by &ThinSpace; <a href="https://github.com/raf0411">@raf0411</a>.
  </footer> 
</body>
</html>
